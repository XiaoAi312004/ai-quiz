<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI題庫">
<meta name="theme-color" content="#0d0d14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>AI 應用規劃師題庫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0d14;
    --surface:  #16161f;
    --surface2: #1e1e2a;
    --border:   #2a2a3a;
    --amber:    #f59e0b;
    --amber2:   #fbbf24;
    --rose:     #f43f5e;
    --teal:     #2dd4bf;
    --text:     #f0eff8;
    --muted:    #6b6985;
    --correct:  #22c55e;
    --wrong:    #ef4444;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ─── APP SHELL ─── */
  #app {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bot);
  }

  /* ─── SCREENS ─── */
  .screen {
    position:absolute; inset:0;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bot);
    display:flex; flex-direction:column;
    transition: transform .32s cubic-bezier(.4,0,.2,1), opacity .32s ease;
  }
  .screen.hidden    { transform:translateX(100%); opacity:0; pointer-events:none; }
  .screen.exit-left { transform:translateX(-40%); opacity:0; pointer-events:none; }

  /* ─── STATUS BAR SPACER ─── */
  .status-bar {
    height: max(var(--safe-top), 12px);
    flex-shrink:0;
  }

  /* ══════════════════════════
     HOME SCREEN
  ══════════════════════════ */
  #screen-home {
    padding: 0 24px;
    justify-content: center;
    gap: 0;
    background: var(--bg);
  }
  #screen-home::before {
    content:'';
    position:absolute;
    top:-80px; left:-60px;
    width:300px; height:300px;
    background: radial-gradient(circle, rgba(245,158,11,.15) 0%, transparent 70%);
    pointer-events:none;
  }
  #screen-home::after {
    content:'';
    position:absolute;
    bottom:40px; right:-40px;
    width:220px; height:220px;
    background: radial-gradient(circle, rgba(45,212,191,.1) 0%, transparent 70%);
    pointer-events:none;
  }
  .home-eyebrow {
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:16px;
  }
  .home-title {
    font-size:32px;
    font-weight:900;
    line-height:1.15;
    margin-bottom:8px;
    color:#fff;
  }
  .home-title em {
    font-style:normal;
    color:var(--amber);
  }
  .home-sub {
    font-size:14px;
    color:var(--muted);
    margin-bottom:44px;
    line-height:1.6;
  }
  .mode-cards {
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:16px;
    position:relative; z-index:1;
  }
  .mode-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius:18px;
    padding:20px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
    transition: background .15s, border-color .15s, transform .1s;
    active-transform: scale(.97);
  }
  .mode-card:active { transform:scale(.97); background:var(--surface2); }
  .mode-card.amber  { border-color:rgba(245,158,11,.25); }
  .mode-card.teal   { border-color:rgba(45,212,191,.25); }
  .mode-card.amber:active { border-color:var(--amber); }
  .mode-card.teal:active  { border-color:var(--teal); }
  .mode-icon {
    width:46px; height:46px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    flex-shrink:0;
  }
  .mode-icon.amber { background:rgba(245,158,11,.12); }
  .mode-icon.teal  { background:rgba(45,212,191,.12); }
  .mode-icon.rose  { background:rgba(244,63,94,.12); }
  .mode-info { flex:1; min-width:0; }
  .mode-name {
    font-size:16px;
    font-weight:700;
    color:#fff;
    margin-bottom:3px;
  }
  .mode-desc { font-size:13px; color:var(--muted); line-height:1.4; }
  .mode-arrow {
    font-size:18px;
    color:var(--muted);
  }
  .mixed-btn {
    background: linear-gradient(135deg, rgba(245,158,11,.15), rgba(45,212,191,.15));
    border: 1.5px solid rgba(245,158,11,.3);
    border-radius:18px;
    padding:18px 20px;
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    cursor:pointer;
    font-family:'Noto Sans TC', sans-serif;
    font-size:16px; font-weight:700; color:#fff;
    -webkit-user-select:none; user-select:none;
    transition: transform .1s, opacity .15s;
    position:relative; z-index:1;
  }
  .mixed-btn:active { transform:scale(.97); opacity:.85; }

  /* ══════════════════════════
     QUIZ SCREEN
  ══════════════════════════ */
  #screen-quiz {
    background: var(--bg);
    padding: 0;
  }

  /* Top bar */
  .quiz-topbar {
    display:flex; align-items:center;
    padding: max(var(--safe-top), 16px) 20px 12px;
    gap:12px;
    flex-shrink:0;
  }
  .back-tap {
    width:40px; height:40px;
    border-radius:12px;
    background:var(--surface);
    border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer;
    flex-shrink:0;
    transition: background .1s;
  }
  .back-tap:active { background:var(--surface2); }
  .progress-wrap { flex:1; }
  .progress-label {
    font-family:'DM Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    display:flex; justify-content:space-between;
  }
  .progress-label span { color:var(--text); font-weight:500; }
  .progress-track {
    height:5px;
    background:var(--surface2);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill {
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg, var(--amber), var(--teal));
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }
  .score-badge {
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:6px 12px;
    font-family:'DM Mono', monospace;
    font-size:13px;
    color:var(--amber2);
    flex-shrink:0;
  }

  /* Scrollable content */
  .quiz-scroll {
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:4px 20px 16px;
  }

  /* Subject badge */
  .subj-pill {
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 12px;
    border-radius:99px;
    font-size:12px; font-weight:500;
    border:1px solid;
    margin-bottom:14px;
  }
  .subj-pill.s1 { color:var(--amber);  border-color:rgba(245,158,11,.3);  background:rgba(245,158,11,.07); }
  .subj-pill.s2 { color:var(--teal);   border-color:rgba(45,212,191,.3);  background:rgba(45,212,191,.07); }

  /* Question card */
  .q-card {
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:20px;
    padding:22px 20px;
    margin-bottom:14px;
  }
  .q-num {
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:12px;
  }
  .q-text {
    font-size:16px;
    font-weight:500;
    line-height:1.75;
    color:#fff;
  }

  /* Options */
  .opts { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .opt {
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:15px 16px;
    display:flex; align-items:flex-start; gap:12px;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
    transition: background .1s, border-color .12s;
    min-height:52px;
  }
  .opt:active:not(:disabled) { background:var(--surface2); }
  .opt-key {
    width:28px; height:28px;
    border-radius:8px;
    background:var(--surface2);
    border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:'DM Mono', monospace;
    font-size:13px; font-weight:500;
    color:var(--muted);
    flex-shrink:0;
    transition: background .12s, border-color .12s, color .12s;
  }
  .opt-text {
    font-size:14.5px;
    line-height:1.6;
    color:var(--text);
    padding-top:4px;
  }
  /* Correct */
  .opt.correct          { border-color:var(--correct); background:rgba(34,197,94,.07); }
  .opt.correct .opt-key { background:var(--correct); border-color:var(--correct); color:#fff; }
  /* Wrong */
  .opt.wrong            { border-color:var(--wrong); background:rgba(239,68,68,.06); }
  .opt.wrong .opt-key   { background:var(--wrong); border-color:var(--wrong); color:#fff; }
  .opt.wrong .opt-text  { color:var(--muted); }
  /* Reveal */
  .opt.reveal           { border-color:var(--correct); background:rgba(34,197,94,.05); }
  .opt.reveal .opt-key  { background:rgba(34,197,94,.15); border-color:var(--correct); color:var(--correct); }
  .opt:disabled         { cursor:default; }

  /* Feedback */
  .feedback {
    border-radius:14px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.6;
    margin-bottom:14px;
    display:none;
    border:1px solid;
  }
  .feedback.correct {
    display:block;
    background:rgba(34,197,94,.08);
    border-color:rgba(34,197,94,.25);
    color:var(--correct);
  }
  .feedback.wrong {
    display:block;
    background:rgba(239,68,68,.07);
    border-color:rgba(239,68,68,.2);
    color:#fca5a5;
  }

  /* Bottom action */
  .quiz-bottom {
    padding: 12px 20px max(var(--safe-bot), 20px);
    flex-shrink:0;
  }
  .next-btn {
    width:100%;
    height:56px;
    background:linear-gradient(135deg, #d97706, var(--amber));
    border:none; border-radius:16px;
    color:#fff;
    font-family:'Noto Sans TC', sans-serif;
    font-size:17px; font-weight:700;
    cursor:pointer;
    display:none;
    align-items:center; justify-content:center; gap:8px;
    -webkit-user-select:none; user-select:none;
    transition:opacity .15s, transform .1s;
    box-shadow:0 4px 20px rgba(245,158,11,.3);
  }
  .next-btn.show { display:flex; }
  .next-btn:active { opacity:.85; transform:scale(.98); }

  /* Swipe hint */
  .swipe-hint {
    text-align:center;
    font-size:12px;
    color:var(--muted);
    padding-bottom:4px;
    display:none;
  }
  .swipe-hint.show { display:block; }

  /* ══════════════════════════
     RESULT SCREEN
  ══════════════════════════ */
  #screen-result {
    background:var(--bg);
    justify-content:center;
    align-items:center;
    padding:32px 24px;
    gap:0;
  }
  .result-ring-wrap {
    position:relative;
    width:160px; height:160px;
    margin-bottom:28px;
  }
  .result-ring-wrap svg {
    transform:rotate(-90deg);
  }
  .result-ring-inner {
    position:absolute;
    inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:2px;
  }
  .result-pct {
    font-family:'DM Mono', monospace;
    font-size:34px; font-weight:500;
    color:var(--amber2);
  }
  .result-pct-lbl {
    font-size:12px;
    color:var(--muted);
  }
  .result-title {
    font-size:26px; font-weight:900;
    color:#fff;
    margin-bottom:8px;
  }
  .result-sub {
    font-size:14px;
    color:var(--muted);
    text-align:center;
    line-height:1.6;
    margin-bottom:36px;
    max-width:280px;
  }
  .result-stats {
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    width:100%;
    margin-bottom:32px;
  }
  .stat-box {
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:18px 10px;
    text-align:center;
  }
  .stat-n {
    font-family:'DM Mono', monospace;
    font-size:28px;
  }
  .stat-n.g { color:var(--correct); }
  .stat-n.r { color:var(--wrong); }
  .stat-n.a { color:var(--amber2); }
  .stat-lbl { font-size:12px; color:var(--muted); margin-top:4px; }
  .result-btns {
    display:flex; flex-direction:column; gap:12px; width:100%;
  }
  .btn-primary {
    width:100%; height:56px;
    background:linear-gradient(135deg, #d97706, var(--amber));
    border:none; border-radius:16px;
    color:#fff; font-family:'Noto Sans TC', sans-serif;
    font-size:17px; font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 20px rgba(245,158,11,.3);
    transition:opacity .15s;
  }
  .btn-primary:active { opacity:.85; }
  .btn-secondary {
    width:100%; height:52px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:16px;
    color:var(--text);
    font-family:'Noto Sans TC', sans-serif;
    font-size:16px; font-weight:600;
    cursor:pointer;
    transition: border-color .15s;
  }
  .btn-secondary:active { border-color:var(--amber); }

  /* ─── Swipe animation ─── */
  .slide-out { animation: slideOut .25s forwards ease-in; }
  .slide-in  { animation: slideIn  .3s  forwards ease-out; }
  @keyframes slideOut {
    to { transform:translateX(-80px); opacity:0; }
  }
  @keyframes slideIn {
    from { transform:translateX(60px); opacity:0; }
    to   { transform:translateX(0);    opacity:1; }
  }
</style>
</head>
<body>

<!-- ══════════ HOME ══════════ -->
<div id="screen-home" class="screen">
  <div class="status-bar"></div>
  <div style="padding:0 24px; flex:1; display:flex; flex-direction:column; justify-content:center;">
    <p class="home-eyebrow">✦ 115 年公告試題</p>
    <h1 class="home-title">AI 應用<br>規劃師<em>題庫</em></h1>
    <p class="home-sub">初級能力鑑定 · 100 道真題<br>即時回饋 · 完全離線可用</p>
    <div class="mode-cards">
      <div class="mode-card amber" onclick="startQuiz(0)">
        <div class="mode-icon amber">🧠</div>
        <div class="mode-info">
          <div class="mode-name">第一科</div>
          <div class="mode-desc">人工智慧基礎概論 · 50 題</div>
        </div>
        <div class="mode-arrow">›</div>
      </div>
      <div class="mode-card teal" onclick="startQuiz(1)">
        <div class="mode-icon teal">🤖</div>
        <div class="mode-info">
          <div class="mode-name">第二科</div>
          <div class="mode-desc">生成式 AI 應用與規劃 · 50 題</div>
        </div>
        <div class="mode-arrow">›</div>
      </div>
    </div>
    <button class="mixed-btn" onclick="startQuiz(2)">
      ⚡ 全科混合練習（100 題）
    </button>
  </div>
</div>

<!-- ══════════ QUIZ ══════════ -->
<div id="screen-quiz" class="screen hidden">
  <div class="quiz-topbar">
    <div class="back-tap" onclick="goHome()">←</div>
    <div class="progress-wrap">
      <div class="progress-label">
        進度 <span id="prog-text">1 / 50</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="prog-fill" style="width:2%"></div>
      </div>
    </div>
    <div class="score-badge" id="score-badge">✓ 0</div>
  </div>

  <div class="quiz-scroll" id="quiz-scroll">
    <div id="q-content">
      <div id="subj-pill"></div>
      <div class="q-card">
        <div class="q-num" id="q-num">第 1 題</div>
        <div class="q-text" id="q-text"></div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <div class="quiz-bottom">
    <div class="swipe-hint" id="swipe-hint">← 左滑進入下一題</div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">
      <span id="next-label">下一題</span> <span>→</span>
    </button>
  </div>
</div>

<!-- ══════════ RESULT ══════════ -->
<div id="screen-result" class="screen hidden">
  <div class="status-bar"></div>
  <div class="result-ring-wrap">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="68" fill="none" stroke="#1e1e2a" stroke-width="14"/>
      <circle cx="80" cy="80" r="68" fill="none" stroke="url(#rg)" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="427.26" id="ring-progress"
        stroke-dashoffset="427.26"/>
      <defs>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#2dd4bf"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="result-ring-inner">
      <div class="result-pct" id="res-pct">0%</div>
      <div class="result-pct-lbl">得分率</div>
    </div>
  </div>
  <h2 class="result-title" id="res-title">測驗完成</h2>
  <p  class="result-sub"   id="res-sub"></p>
  <div class="result-stats">
    <div class="stat-box"><div class="stat-n g" id="r-correct">0</div><div class="stat-lbl">答對</div></div>
    <div class="stat-box"><div class="stat-n r" id="r-wrong">0</div><div class="stat-lbl">答錯</div></div>
    <div class="stat-box"><div class="stat-n a" id="r-total">0</div><div class="stat-lbl">總題數</div></div>
  </div>
  <div class="result-btns">
    <button class="btn-primary"   onclick="restartQuiz()">再練一遍 ↺</button>
    <button class="btn-secondary" onclick="goHome()">← 返回選題</button>
  </div>
</div>

<script>
// ─── Question Data ────────────────────────────────────────────
const Q1 = [
  { s:1, q:"下列何者不屬於資料整合（Data Integration）的主要目的？", o:["統一不同來源資料的格式與欄位定義，以確保分析一致性","識別並處理重複資料，避免影響模型訓練結果","整併多來源資料，以提升資料完整性與應用價值","依資料保存政策延長原始資料留存期限，以利未來可能的分析需求"], a:3 },
  { s:1, q:"某智慧城市專案導入 AI 技術，以優化垃圾收集路線調度並即時監測空氣品質變化。系統需持續蒐集環境數據（如 PM2.5、氣體濃度）與設備狀態（如垃圾桶滿溢度）。下列何種技術最直接支援上述需求？", o:["專家系統（Expert System）","決策支援系統（Decision Support System）","啟發式決策引擎（Heuristic Decision Engine）","感知器網路（Sensor Network）"], a:3 },
  { s:1, q:"下列何者不符合非監督式學習（Unsupervised Learning）的典型特徵？", o:["模型可依據資料中的特徵相似性進行自動分群","訓練過程中不需仰賴事先定義的標籤資料","常用於探索資料的潛在結構或隱含模式","模型主要學習輸入特徵與既定目標標記之間的對應關係"], a:3 },

// ─── State ─────────────────────────────────────────────────
let qs = [], cur = 0, score = 0, answered = false, mode = -1;
const LABELS = ['A','B','C','D'];

function shuffle(a) {
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ─── Navigation ────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    if (s.id === id) {
      s.classList.remove('hidden','exit-left');
    } else {
      s.classList.add('hidden');
      s.classList.remove('exit-left');
    }
  });
}

function goHome() {
  showScreen('screen-home');
}

// ─── Quiz Logic ─────────────────────────────────────────────
function startQuiz(m) {
  mode = m;
  if (m === 0) qs = shuffle([...Q1]);
  else if (m === 1) qs = shuffle([...Q2]);
  else qs = shuffle([...Q1,...Q2]);
  cur = 0; score = 0;
  showScreen('screen-quiz');
  renderQ();
}

function renderQ() {
  answered = false;
  const q = qs[cur];
  const total = qs.length;

  document.getElementById('prog-text').textContent = `${cur+1} / ${total}`;
  document.getElementById('prog-fill').style.width = ((cur+1)/total*100)+'%';
  document.getElementById('score-badge').textContent = `✓ ${score}`;
  document.getElementById('q-num').textContent = `第 ${cur+1} 題`;
  document.getElementById('q-text').textContent = q.q;

  const pill = document.getElementById('subj-pill');
  pill.innerHTML = `<span class="subj-pill s${q.s}">${q.s===1 ? '🔵 第一科' : '🟢 第二科'}</span>`;

  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  q.o.forEach((txt,i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${LABELS[i]}</span><span class="opt-text">${txt}</span>`;
    btn.onclick = () => pick(i);
    opts.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  const nb = document.getElementById('next-btn');
  nb.classList.remove('show');
  document.getElementById('swipe-hint').classList.remove('show');
  document.getElementById('next-label').textContent = cur < qs.length-1 ? '下一題' : '查看結果';

  // Scroll to top
  document.getElementById('quiz-scroll').scrollTo(0,0);

  // Slide in
  const content = document.getElementById('q-content');
  content.classList.remove('slide-out','slide-in');
  void content.offsetWidth;
  content.classList.add('slide-in');
}

function pick(idx) {
  if (answered) return;
  answered = true;
  if (navigator.vibrate) navigator.vibrate(idx === qs[cur].a ? [30] : [60,30,60]);

  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  const q = qs[cur];
  const fb = document.getElementById('feedback');

  if (idx === q.a) {
    score++;
    btns[idx].classList.add('correct');
    fb.className = 'feedback correct';
    fb.innerHTML = `✓ 答對！正確答案為 ${LABELS[q.a]}。`;
  } else {
    btns[idx].classList.add('wrong');
    btns[q.a].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.innerHTML = `✗ 答錯了。正確答案是 <strong>${LABELS[q.a]}（${q.o[q.a]}）</strong>`;
  }

  document.getElementById('score-badge').textContent = `✓ ${score}`;
  document.getElementById('next-btn').classList.add('show');
  document.getElementById('swipe-hint').classList.add('show');
}

function nextQuestion() {
  const content = document.getElementById('q-content');
  content.classList.add('slide-out');
  setTimeout(() => {
    if (cur < qs.length-1) {
      cur++;
      renderQ();
    } else {
      showResult();
    }
  }, 220);
}

// ─── Swipe Gesture ─────────────────────────────────────────
let touchStartX = 0, touchStartY = 0;
document.getElementById('quiz-scroll').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive:true });
document.getElementById('quiz-scroll').addEventListener('touchend', e => {
  if (!answered) return;
  const dx = touchStartX - e.changedTouches[0].clientX;
  const dy = Math.abs(touchStartY - e.changedTouches[0].clientY);
  if (dx > 60 && dy < 80) nextQuestion();
}, { passive:true });

// ─── Result ─────────────────────────────────────────────────
function showResult() {
  showScreen('screen-result');
  const total = qs.length;
  const pct = Math.round(score/total*100);
  const circ = 427.26;
  const offset = circ - (circ * pct / 100);

  document.getElementById('res-pct').textContent = pct+'%';
  document.getElementById('r-correct').textContent = score;
  document.getElementById('r-wrong').textContent = total-score;
  document.getElementById('r-total').textContent = total;

  setTimeout(() => {
    document.getElementById('ring-progress').style.transition = 'stroke-dashoffset 1s ease';
    document.getElementById('ring-progress').style.strokeDashoffset = offset;
  }, 100);

  let title, sub;
  if (pct >= 80) { title='🎉 優秀！'; sub='已充分掌握考試要點，繼續保持！'; }
  else if (pct >= 60) { title='👍 及格！'; sub='基礎紮實，建議針對答錯題目再複習。'; }
  else { title='📚 繼續加油！'; sub='還有進步空間，再次練習鞏固知識。'; }
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-sub').textContent = sub;
}

function restartQuiz() {
  document.getElementById('ring-progress').style.transition = 'none';
  document.getElementById('ring-progress').style.strokeDashoffset = 427.26;
  startQuiz(mode);
}

// ─── Service Worker ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
